version: "3"

# ディレクトリ名 (docker-compose) 由来のプロジェクト名だと、同名ディレクトリを使う他プロジェクトと衝突するため固定する
name: chat-role-play

services:
  mysql:
    container_name: chat-role-play-mysql
    build:
      context: ./mysql
    ports:
      - 3306:3306
    volumes:
      - crp-mysql-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      TZ: Asia/Tokyo

volumes:
  crp-mysql-db-data:
    # プロジェクト名変更前に作成された既存ボリュームを引き続き使う
    name: docker-compose_crp-mysql-db-data
